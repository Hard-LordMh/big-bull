# BIG BULL — Clean Light Theme
# Minimal, high-contrast white UI for the prediction dashboard

[theme]
base = "light"
primaryColor = "#2563EB"              # Blue accent
backgroundColor = "#FFFFFF"           # Pure white canvas
secondaryBackgroundColor = "#F4F6FB"  # Soft grey-blue panels
codeBackgroundColor = "#F1F5F9"
textColor = "#0F172A"                 # Slate-900 text
linkColor = "#2563EB"
borderColor = "#E2E8F0"
codeTextColor = "#334155"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "12px"
buttonRadius = "10px"

font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 15
baseFontWeight = 400
headingFontSizes = ["30px", "24px", "19px", "16px", "14px", "12px"]
headingFontWeights = [800, 800, 700, 700, 600, 600]
linkUnderline = true

# Semantic financial colors (darkened for contrast on white)
greenColor = "#059669"   # Positive / gains
redColor = "#DC2626"     # Negative / losses
yellowColor = "#D97706"  # Warning / neutral
orangeColor = "#EA580C"  # Alert
blueColor = "#2563EB"    # Info / primary
violetColor = "#7C3AED"  # Accent
grayColor = "#64748B"    # Muted

chartCategoricalColors = [
    "#2563EB",
    "#059669",
    "#7C3AED",
    "#DC2626",
    "#D97706",
    "#0891B2",
    "#64748B",
    "#EA580C",
]

chartSequentialColors = [
    "#EFF6FF",
    "#DBEAFE",
    "#BFDBFE",
    "#93C5FD",
    "#60A5FA",
    "#3B82F6",
    "#2563EB",
    "#1D4ED8",
    "#1E40AF",
]

dataframeBorderColor = "#E2E8F0"
dataframeHeaderBackgroundColor = "#F1F5F9"
dataframeHeaderTextColor = "#0F172A"

[theme.sidebar]
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#F1F5F9"
codeBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
borderColor = "#E2E8F0"
primaryColor = "#2563EB"
